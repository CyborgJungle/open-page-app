<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="Open a webpage from its available HTML or a public archived copy."><title>Open Page</title><meta name="theme-color" content="#faf9f6"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Open Page"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon-v3.png"><link rel="icon" type="image/png" href="/icons/favicon-v3.png"><style>

lex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:20px;color:#96948d;font-size:14px}.empty img{width:64px;height:64px;border-radius:16px}.install-backdrop{position:fixed;top:0;right:0;bottom:0;left:0;background:#0005;z-index:10;display:flex;align-items:center;justify-content:center;padding:24px}.install-box{max-width:330px;background:#fff;padding:24px;border-radius:14px;box-shadow:0 10px 40px #0002}.install-box h2{font-size:18px;margin:0 0 10px}.install-box p{font-size:14px;margin:0 0 20px;color:#666}.install-box button{width:100%}[hidden]{display:none!important}@media(max-width:700px){.toolbar{display:grid;grid-template-columns:1fr auto;gap:10px;padding:10px 12px;padding-top:calc(10px + env(safe-area-inset-top,0px));padding-left:calc(12px + env(safe-area-inset-left,0px));padding-right:calc(12px + env(safe-area-inset-right,0px))}.name{grid-column:1;grid-row:1}.extra{grid-column:2;grid-row:1;gap:6px}form{grid-column:1 / -1;grid-row:2;width:100%;max-width:none}.extra a{display:none}.extra button,.install{font-size:12px;padding:0 10px}.status{padding:7px 12px}button{padding:0 14px}}@media(display-mode:standalone){.install{display:none}}@media(max-width:350px){.name{gap:7px;font-size:13px}.name img{width:30px;height:30px}.extra button,.install{padding:0 8px}.toolbar{column-gap:6px}}@media(prefers-reduced-motion:no-preference){button{transition:opacity .15s,background .15s}}

</style></head><body>
<header class="toolbar"><span class="name"><img src="/icons/icon-192-v3.png" alt="">Open Page</span><form id="open-form"><input id="url" type="text" inputmode="url" enterkeyhint="go" placeholder="Paste a webpage URL" aria-label="Webpage URL" autocomplete="url" autocapitalize="none" autocorrect="off" spellcheck="false" required><button id="open" type="submit">Open →</button></form><div class="extra"><div class="extra" id="actions" hidden><a id="original" target="_blank" rel="noopener noreferrer">Original ↗</a><button id="download" type="button">Save</button></div><button class="install" id="install" type="button" aria-label="Install Open Page">Install</button></div></header>
<div id="status" class="status" role="status" aria-live="polite" hidden></div><div id="empty" class="empty"><img src="/icons/icon-192-v3.png" alt=""><span>Paste a link to open a page.</span></div><iframe id="page" title="Captured webpage" sandbox="allow-popups allow-popups-to-escape-sandbox" referrerpolicy="no-referrer" hidden></iframe>
<div class="install-backdrop" id="install-panel" role="dialog" aria-modal="true" aria-labelledby="install-title" hidden><div class="install-box"><h2 id="install-title">Add Open Page</h2><p id="install-text">In Safari, tap Share, then Add to Home Screen.</p><button id="close-install" type="button">Got it</button></div></div>
<script>
'use strict';const $=id=>document.getElementById(id);let snapshot=null,pending=null,installPrompt=null;
const escapeHtml=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function message(text,error=false){$('status').textContent=text;$('status').classList.toggle('error',error);$('status').hidden=!text;}
async function request(url,mode,signal){const r=await fetch('/api/capture',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url,mode}),signal});const d=await r.json();if(!r.ok)throw new Error(d.error||'Could not open this page.');return d;}
function articleHints(doc){let restricted=false,expected=0;function visit(value,depth=0){if(!value||typeof value!=='object'||depth>12)return;if(Array.isArray(value)){for(const item of value)visit(item,depth+1);return;}const types=[].concat(value['@type']||[]);if(types.some(t=>/^(?:NewsArticle|Article|BlogPosting|ReportageNewsArticle)$/.test(String(t)))){if(value.isAccessibleForFree===false||value.isAccessibleForFree==='false')restricted=true;const count=Number(value.wordCount);if(Number.isFinite(count)&&count>0&&count<100000)expected=Math.max(expected,count);if(typeof value.articleBody==='string')expected=Math.max(expected,value.articleBody.trim().split(/\s+/).length);}for(const key of ['@graph','mainEntity','hasPart'])if(value[key])visit(value[key],depth+1);}
for(const node of doc.querySelectorAll('script[type="application/ld+json"]')){try{visit(JSON.parse(node.textContent));}catch{}}
for(const node of doc.querySelectorAll('[itemprop="isAccessibleForFree"]'))if((node.getAttribute('content')||node.textContent).trim()==='false')restricted=true;
return {restricted,expected};}
const ARTICLE_SELECTORS='[itemprop="articleBody"],.article__body,.body__inner-container,[data-testid="article-body"],.article-body-content,.story-body,article .entry-content';
function inspect(d){if(/text\/plain/.test(d.contentType))return {words:d.html.trim().split(/\s+/).length,limited:false,blocked:false};const doc=new DOMParser().parseFromString(d.html,'text/html');const hints=articleHints(doc);doc.querySelectorAll('script,style,noscript,nav,header,footer,aside,[role="navigation"]').forEach(n=>n.remove());const specific=[...doc.querySelectorAll(ARTICLE_SELECTORS)].sort((a,b)=>b.textContent.length-a.textContent.length)[0];const root=specific||doc.querySelector('article')||doc.querySelector('main')||doc.body;const text=root.textContent.replace(/\s+/g,' ').trim();const words=text?text.split(/\s+/).length:0;const notice=/subscribe to (?:continue|read|unlock)|already a subscriber|subscription required|subscriber[ -]only|sign in to (?:continue|read)|unlock this article|purchase a subscription/i.test(text);const blocked=words<300&&(/(?:checking|verify) (?:your )?browser|enable javascript and cookies|verify (?:you are|you're) human|access denied|captcha/i.test(text)||!!doc.querySelector('#challenge-form,#cf-challenge-running,.g-recaptcha'));const limited=blocked||notice&&words<600||hints.restricted&&words<300||hints.expected>=150&&words<hints.expected*.6;return {words,limited,blocked,restricted:hints.restricted,expectedWords:hints.expected};}
function removeEmptyAds(doc){const selectors='[data-testid="sticky-hero-ad"],.ad-stickyhero,[class*="StickyHeroAdWrapper-"],[class*="AdWrapper-"],.ad,.ad-slot,.ad-container,[data-ad-slot],[data-ad-unit],[id^="google_ads_iframe"],ins.adsbygoogle';for(const slot of [...doc.querySelectorAll(selectors)]){const text=slot.textContent.replace(/\s+/g,' ').trim();const meaningfulText=text&&!/^(?:advertisement|advertising|ad|sponsored|sponsor message)$/i.test(text);const meaningfulMedia=slot.querySelector('img[src],picture,video,svg');if(!meaningfulText&&!meaningfulMedia)slot.remove();}}
function resolveSrcset(value,base){let index=0;const candidates=[];while(index<value.length){while(index<value.length&&/[\s,]/.test(value[index]))index++;const start=index;while(index<value.length&&!/\s/.test(value[index]))index++;let url=value.slice(start,index);let descriptors='';if(url.endsWith(',')){url=url.replace(/,+$/,'');}else{while(index<value.length&&/\s/.test(value[index]))index++;const begin=index;while(index<value.length&&value[index]!==',')index++;descriptors=value.slice(begin,index).trim();if(value[index]===',')index++;}if(!url)continue;try{const target=new URL(url,base);if(['http:','https:'].includes(target.protocol)||/^data:image\//i.test(url))candidates.push(target.href+(descriptors?' '+descriptors:''));}catch{}}return candidates.join(', ');}
function prepare(d){let doc;if(/text\/plain/.test(d.contentType)){doc=document.implementation.createHTMLDocument('Captured page');const p=doc.createElement('pre');p.textContent=d.html;p.style.whiteSpace='pre-wrap';doc.body.append(p);}else doc=new DOMParser().parseFromString(d.html,'text/html');
const title=doc.title||new URL(d.sourceUrl).hostname;
// Remove static subscription dialogs while retaining the article already present in HTML.
for(const gate of doc.querySelectorAll('[role="dialog"],[aria-modal="true"],[class*="paywall-overlay"],[id*="paywall-overlay"],[class*="paywall-modal"],[class*="regwall-overlay"]')){const text=gate.textContent.trim();if(text.length<3000&&/subscribe|subscription|subscriber|sign in to read|unlock (?:this|the) article/i.test(text))gate.remove();}
if(doc.body)doc.body.style.overflow='auto';
// The snapshot is isolated; keep static presentation and remove executable content.
doc.querySelectorAll('script,noscript,iframe,frame,frameset,object,embed,base,meta[http-equiv],link[rel="preload"][as="script"],link[rel="modulepreload"],#wm-ipp-base').forEach(n=>n.remove());
removeEmptyAds(doc);
for(const el of doc.querySelectorAll('*')){for(const a of [...el.attributes]){if(/^on/i.test(a.name)||['srcdoc','nonce','integrity'].includes(a.name.toLowerCase()))el.removeAttribute(a.name);}
for(const attr of ['href','src','action','formaction','poster','data','xlink:href']){const value=el.getAttribute(attr);if(!value)continue;try{const target=new URL(value,d.sourceKind==='wayback'?d.sourceUrl:d.resolvedUrl);if(['http:','https:'].includes(target.protocol)||attr==='src'&&/^data:image\//i.test(value))el.setAttribute(attr,target.href);else if(attr==='href'&&value.startsWith('#'))el.setAttribute(attr,value);else el.removeAttribute(attr);}catch{el.removeAttribute(attr);}}
const srcsetAttr=[...el.attributes].find(a=>a.name.toLowerCase()==='srcset');if(srcsetAttr){const value=srcsetAttr.value;el.removeAttribute(srcsetAttr.name);el.setAttribute('srcset',resolveSrcset(value,d.sourceKind==='wayback'?d.sourceUrl:d.resolvedUrl));}
if(el.tagName==='A'){el.setAttribute('target','_blank');el.setAttribute('rel','noopener noreferrer');}
if(el.tagName==='FORM'){el.removeAttribute('action');el.removeAttribute('method');}
}
const base=doc.createElement('base');base.href=d.sourceKind==='wayback'?d.sourceUrl:d.resolvedUrl;doc.head.prepend(base);
const csp=doc.createElement('meta');csp.httpEquiv='Content-Security-Policy';csp.content="default-src 'none'; script-src 'none'; style-src 'unsafe-inline' https: http:; img-src https: http: data:; font-src https: http: data:; media-src https: http:; base-uri https: http:; form-action 'none'";doc.head.prepend(csp);
const ref=doc.createElement('meta');ref.name='referrer';ref.content='no-referrer';doc.head.prepend(ref);
if(!doc.querySelector('meta[name="viewport"]')){const v=doc.createElement('meta');v.name='viewport';v.content='width=device-width,initial-scale=1';doc.head.append(v);}
return {title,html:'<!doctype html>\n'+doc.documentElement.outerHTML};}
$('open-form').onsubmit=async e=>{e.preventDefault();if(typeof navigator!=='undefined'&&navigator.onLine===false){message('You are offline. Connect to the internet to open a page.',true);return;}$('url').blur();if(pending)pending.abort();pending=new AbortController();const control=pending;$('open').disabled=true;message('Opening page…');try{let d=await request($('url').value.trim(),'auto',control.signal);let info=inspect(d);if(d.sourceKind==='live'&&(info.limited||info.words<10)){message('Checking for an available archived copy…');try{const archived=await request(d.sourceUrl,'wayback',control.signal);const candidate=inspect(archived);if(candidate.words>info.words&&!candidate.limited&&!candidate.blocked){d=archived;info=candidate;}}catch(e){if(e.name==='AbortError')throw e;}}
if(info.blocked)throw new Error('This website returned an access challenge, and no readable archived copy was available.');
const visual=prepare(d);snapshot={...d,...visual,limited:info.limited};$('page').srcdoc=visual.html;$('page').hidden=false;$('empty').hidden=true;$('actions').hidden=false;$('original').href=d.sourceUrl;document.title=visual.title+' · Open Page';let summary='';if(d.sourceKind==='wayback'){const t=d.archiveTimestamp;summary='Archived copy · '+t.slice(0,4)+'-'+t.slice(4,6)+'-'+t.slice(6,8);}else summary='Live page';summary+=info.limited?' · This capture may be incomplete.':' · '+new URL(d.sourceUrl).hostname;message(summary);}
catch(e){if(e.name!=='AbortError')message(e.message,true);}finally{if(pending===control){$('open').disabled=false;pending=null;}}};
$('download').onclick=async()=>{if(!snapshot)return;const provenance='<!-- Original URL: '+escapeHtml(snapshot.sourceUrl)+' | Retrieved: '+snapshot.capturedAt+' | Source: '+snapshot.sourceKind+(snapshot.archiveTimestamp?' | Archive timestamp: '+snapshot.archiveTimestamp:'')+' | Response SHA-256: '+snapshot.responseSha256+' -->\n';const blob=new Blob([provenance+snapshot.html],{type:'text/html'});const fileName=(snapshot.title.replace(/[^\p{L}\p{N}\s-]/gu,'').replace(/\s+/g,'-').slice(0,65)||'page')+'.html';if(typeof File!=='undefined'&&navigator.canShare){const file=new File([blob],fileName,{type:'text/html'});if(navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:snapshot.title});message('Snapshot shared. Images and styles still use their web addresses.');}catch(e){if(e.name!=='AbortError')message('Sharing is unavailable. Try saving from Safari.',true);}return;}}const a=document.createElement('a');const href=URL.createObjectURL(blob);a.href=href;a.download=fileName;a.click();setTimeout(()=>URL.revokeObjectURL(href),1000);message('Saved. Images and styles still use their web addresses.');};
function closeInstall(){$('install-panel').hidden=true;$('install').focus();}
$('install').onclick=async()=>{if(installPrompt){const prompt=installPrompt;installPrompt=null;await prompt.prompt();return;}$('install-text').textContent=/iPad|iPhone|iPod/.test(navigator.userAgent)?'In Safari, tap Share, then Add to Home Screen.':'Open your browser menu and choose Install app or Add to Home Screen.';$('install-panel').hidden=false;$('close-install').focus();};
$('close-install').onclick=closeInstall;$('install-panel').onclick=e=>{if(e.target===$('install-panel'))closeInstall();};
if(typeof window!=='undefined'){
function fitViewport(){document.documentElement.style.setProperty('--app-height',window.innerHeight+'px');}fitViewport();window.addEventListener('resize',fitViewport);window.addEventListener('orientationchange',fitViewport);
window.addEventListener('beforeinstallprompt',event=>{event.preventDefault();installPrompt=event;});window.addEventListener('appinstalled',()=>{$('install').hidden=true;});window.addEventListener('keydown',event=>{if(!$('install-panel').hidden){if(event.key==='Escape')closeInstall();if(event.key==='Tab'){event.preventDefault();$('close-install').focus();}}});
if((window.navigator&&window.navigator.standalone)||(window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches))$('install').hidden=true;
window.addEventListener('offline',()=>message('You are offline. Connect to the internet to open a new page.',true));
if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
}
</script></body></html>
