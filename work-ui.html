<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Open a webpage from its available HTML or a public archived copy."><title>Open Page</title><style>
*{box-sizing:border-box}body{margin:0;background:#fff;color:#222;font:14px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.toolbar{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid #e7e7e7;background:#fff;min-height:66px}.name{font-size:14px;font-weight:600;white-space:nowrap;margin-right:8px}form{display:flex;gap:8px;flex:1;max-width:950px}input{width:100%;min-width:0;height:40px;padding:0 12px;border:1px solid #d5d5d5;border-radius:4px;font:inherit;background:#fff}input:focus{outline:2px solid #999;outline-offset:1px}button{height:40px;padding:0 19px;border:1px solid #202020;border-radius:4px;background:#202020;color:white;font:inherit;cursor:pointer;white-space:nowrap}button:disabled{opacity:.5;cursor:wait}.extra{display:flex;gap:12px;align-items:center;margin-left:auto;white-space:nowrap}.extra button{height:32px;font-size:12px;padding:0 10px;background:white;color:#555;border-color:#ddd}.extra a{font-size:12px;color:#555;text-decoration:none}.status{padding:7px 18px;font-size:12px;color:#666;border-bottom:1px solid #eee;background:#fafafa;overflow-wrap:anywhere}.status.error{color:#a3352d;background:#fff8f7}.status a{color:inherit}iframe{display:block;width:100%;border:0;height:calc(100dvh - 103px);background:white}.empty{height:calc(100dvh - 67px);display:grid;place-items:center;color:#a2a2a2;font-size:14px}[hidden]{display:none!important}@media(max-width:650px){.toolbar{gap:8px;padding:10px}.name{display:none}.extra{gap:8px}.extra a{display:none}.extra button{padding:0 7px}button{padding:0 12px}iframe{height:calc(100dvh - 97px)}.status{padding:7px 10px}}
</style></head><body>
<div class="toolbar"><span class="name">Open Page</span><form id="open-form"><input id="url" type="text" inputmode="url" placeholder="Paste a webpage URL" aria-label="Webpage URL" autocomplete="url" required><button id="open" type="submit">Open →</button></form><div class="extra" id="actions" hidden><a id="original" target="_blank" rel="noopener noreferrer">Original ↗</a><button id="download" type="button">Download</button></div></div>
<div id="status" class="status" role="status" aria-live="polite" hidden></div><div id="empty" class="empty">Paste a link above to open a page.</div><iframe id="page" title="Captured webpage" sandbox="allow-popups allow-popups-to-escape-sandbox" referrerpolicy="no-referrer" hidden></iframe>
<script>
'use strict';const $=id=>document.getElementById(id);let snapshot=null,pending=null;
const escapeHtml=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function message(text,error=false){$('status').textContent=text;$('status').classList.toggle('error',error);$('status').hidden=!text;}
async function request(url,mode,signal){const r=await fetch('/api/capture',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url,mode}),signal});const d=await r.json();if(!r.ok)throw new Error(d.error||'Could not open this page.');return d;}
function inspect(d){if(/text\/plain/.test(d.contentType))return {words:d.html.trim().split(/\s+/).length,limited:false};const doc=new DOMParser().parseFromString(d.html,'text/html');doc.querySelectorAll('script,style,noscript,nav,header,footer').forEach(n=>n.remove());const root=doc.querySelector('article')||doc.querySelector('main')||doc.body;const text=root.textContent.trim();const words=text?text.split(/\s+/).length:0;return {words,limited:words<600&&/subscribe to (?:continue|read|unlock)|already a subscriber|subscription required|subscriber[ -]only|sign in to (?:continue|read)|unlock this article|purchase a subscription/i.test(text)};}
function prepare(d){let doc;if(/text\/plain/.test(d.contentType)){doc=document.implementation.createHTMLDocument('Captured page');const p=doc.createElement('pre');p.textContent=d.html;p.style.whiteSpace='pre-wrap';doc.body.append(p);}else doc=new DOMParser().parseFromString(d.html,'text/html');
const title=doc.title||new URL(d.sourceUrl).hostname;
// Remove static subscription dialogs while retaining the article already present in HTML.
for(const gate of doc.querySelectorAll('[role="dialog"],[aria-modal="true"],[class*="paywall-overlay"],[id*="paywall-overlay"],[class*="paywall-modal"],[class*="regwall-overlay"]')){const text=gate.textContent.trim();if(text.length<3000&&/subscribe|subscription|subscriber|sign in to read|unlock (?:this|the) article/i.test(text))gate.remove();}
if(doc.body)doc.body.style.overflow='auto';
// The snapshot is isolated; keep static presentation and remove executable content.
doc.querySelectorAll('script,noscript,iframe,frame,frameset,object,embed,base,meta[http-equiv],link[rel="preload"][as="script"],link[rel="modulepreload"],#wm-ipp-base').forEach(n=>n.remove());
for(const el of doc.querySelectorAll('*')){for(const a of [...el.attributes]){if(/^on/i.test(a.name)||['srcdoc','nonce','integrity'].includes(a.name.toLowerCase()))el.removeAttribute(a.name);}
for(const attr of ['href','src','action','formaction','poster','data','xlink:href']){const value=el.getAttribute(attr);if(!value)continue;try{const target=new URL(value,d.sourceKind==='wayback'?d.sourceUrl:d.resolvedUrl);if(['http:','https:'].includes(target.protocol)||attr==='src'&&/^data:image\//i.test(value))el.setAttribute(attr,target.href);else if(attr==='href'&&value.startsWith('#'))el.setAttribute(attr,value);else el.removeAttribute(attr);}catch{el.removeAttribute(attr);}}
if(el.hasAttribute('srcset')){const value=el.getAttribute('srcset');if(!/data:/i.test(value))el.setAttribute('srcset',value.split(',').map(part=>{const [url,...desc]=part.trim().split(/\s+/);try{const u=new URL(url,d.sourceKind==='wayback'?d.sourceUrl:d.resolvedUrl);return ['http:','https:'].includes(u.protocol)?u.href+' '+desc.join(' '):'';}catch{return '';}}).filter(Boolean).join(','));else el.removeAttribute('srcset');}
if(el.tagName==='A'){el.setAttribute('target','_blank');el.setAttribute('rel','noopener noreferrer');}
if(el.tagName==='FORM'){el.removeAttribute('action');el.removeAttribute('method');}
}
const base=doc.createElement('base');base.href=d.sourceKind==='wayback'?d.sourceUrl:d.resolvedUrl;doc.head.prepend(base);
const csp=doc.createElement('meta');csp.httpEquiv='Content-Security-Policy';csp.content="default-src 'none'; script-src 'none'; style-src 'unsafe-inline' https: http:; img-src https: http: data:; font-src https: http: data:; media-src https: http:; base-uri https: http:; form-action 'none'";doc.head.prepend(csp);
const ref=doc.createElement('meta');ref.name='referrer';ref.content='no-referrer';doc.head.prepend(ref);
if(!doc.querySelector('meta[name="viewport"]')){const v=doc.createElement('meta');v.name='viewport';v.content='width=device-width,initial-scale=1';doc.head.append(v);}
return {title,html:'<!doctype html>\n'+doc.documentElement.outerHTML};}
$('open-form').onsubmit=async e=>{e.preventDefault();pending?.abort();pending=new AbortController();const control=pending;$('open').disabled=true;message('Opening page…');try{let d=await request($('url').value.trim(),'auto',control.signal);let info=inspect(d);if(d.sourceKind==='live'&&(info.limited||info.words<10)){message('Checking for an available archived copy…');try{const archived=await request(d.sourceUrl,'wayback',control.signal);const candidate=inspect(archived);if(candidate.words>info.words&&!candidate.limited){d=archived;info=candidate;}}catch(e){if(e.name==='AbortError')throw e;}}
const visual=prepare(d);snapshot={...d,...visual,limited:info.limited};$('page').srcdoc=visual.html;$('page').hidden=false;$('empty').hidden=true;$('actions').hidden=false;$('original').href=d.sourceUrl;document.title=visual.title+' · Open Page';let summary='';if(d.sourceKind==='wayback'){const t=d.archiveTimestamp;summary='Archived copy · '+t.slice(0,4)+'-'+t.slice(4,6)+'-'+t.slice(6,8);}else summary='Live page';summary+=info.limited?' · Available content may be incomplete.':' · '+new URL(d.sourceUrl).hostname;message(summary);}
catch(e){if(e.name!=='AbortError')message(e.message,true);}finally{if(pending===control){$('open').disabled=false;pending=null;}}};
$('download').onclick=()=>{if(!snapshot)return;const provenance='<!-- Original URL: '+escapeHtml(snapshot.sourceUrl)+' | Retrieved: '+snapshot.capturedAt+' | Source: '+snapshot.sourceKind+(snapshot.archiveTimestamp?' | Archive timestamp: '+snapshot.archiveTimestamp:'')+' | Response SHA-256: '+snapshot.responseSha256+' -->\n';const blob=new Blob([provenance+snapshot.html],{type:'text/html'});const a=document.createElement('a');const href=URL.createObjectURL(blob);a.href=href;a.download=(snapshot.title.replace(/[^\p{L}\p{N}\s-]/gu,'').replace(/\s+/g,'-').slice(0,65)||'page')+'.html';a.click();setTimeout(()=>URL.revokeObjectURL(href),1000);message('Downloaded. Images and styles still use their original web addresses.');};
</script></body></html>
